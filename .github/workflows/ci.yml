name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: takeoff
          POSTGRES_PASSWORD: takeoff
          POSTGRES_DB: takeoff
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takeoff -d takeoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://takeoff:takeoff@localhost:5432/takeoff
      INLINE_JOBS: "true"
      ENGINE: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-packages --group dev
      - name: Ruff
        run: uv run ruff check engine backend
      - name: Alembic
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest
      - name: Eval regression
        run: uv run python -m eval.regression

  web:
    runs-on: ubuntu-latest
    if: hashFiles('web/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        working-directory: web
        run: pnpm install
      - name: Typecheck
        working-directory: web
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: web
        run: pnpm build
      - name: Test
        working-directory: web
        run: pnpm exec vitest run
