[project]
name = "takeoff-backend"
version = "0.1.0"
description = "FastAPI backend for AI electrical takeoff"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "asyncpg",
    "alembic",
    "arq",
    "redis",
    "python-multipart",
    "pydantic-settings",
    "httpx",
    "takeoff-engine",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
takeoff-engine = { workspace = true }
