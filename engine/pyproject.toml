[project]
name = "takeoff-engine"
version = "0.3.1"
description = "Pure electrical takeoff engine (no web)"
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "numpy",
    "opencv-python-headless",
    "shapely>=2",
    "pydantic>=2",
    "anthropic",
    "typer",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
takeoff = "takeoff_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takeoff_engine"]
