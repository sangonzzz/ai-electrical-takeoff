services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: takeoff
      POSTGRES_PASSWORD: takeoff
      POSTGRES_DB: takeoff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeoff -d takeoff"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: takeoff-backend:local
    working_dir: /app
    # ENTRYPOINT runs alembic; CMD is uvicorn (no uv sync, no host .venv)
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./.cache:/app/.cache
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://takeoff:takeoff@db:5432/takeoff
      REDIS_URL: redis://redis:6379/0
      ENGINE: real
      INLINE_JOBS: "false"
      PYTHONPATH: /app/backend
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker:
    image: takeoff-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    # Same image as api; skip alembic entrypoint
    entrypoint: ["arq"]
    command: ["app.worker.WorkerSettings"]
    volumes:
      - ./storage:/app/storage
      - ./.cache:/app/.cache
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://takeoff:takeoff@db:5432/takeoff
      REDIS_URL: redis://redis:6379/0
      ENGINE: real
      PYTHONPATH: /app/backend
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # ARQ has no HTTP port; confirm the worker process is alive
      test: ["CMD-SHELL", "python -c \"import os,signal; os.kill(1,0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
      # Anonymous volumes: Linux-native deps inside the container (not Windows host node_modules)
      - /app/node_modules
      - /app/.pnpm-store
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_FIXTURE: "false"
      PNPM_STORE_DIR: /app/.pnpm-store
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
