services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: takeoff
      POSTGRES_PASSWORD: takeoff
      POSTGRES_DB: takeoff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takeoff -d takeoff"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -c "pip install -q uv && uv sync --all-packages --group dev
      && cd backend && uv run alembic upgrade head
      && cd /app && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --app-dir backend"
    volumes:
      - .:/app
      - ./storage:/app/storage
      - ./.cache:/app/.cache
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://takeoff:takeoff@db:5432/takeoff
      REDIS_URL: redis://redis:6379/0
      ENGINE: real
      INLINE_JOBS: "false"
      PYTHONPATH: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -c "pip install -q uv && uv sync --all-packages --group dev
      && PYTHONPATH=/app/backend uv run arq app.worker.WorkerSettings"
    volumes:
      - .:/app
      - ./storage:/app/storage
      - ./.cache:/app/.cache
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://takeoff:takeoff@db:5432/takeoff
      REDIS_URL: redis://redis:6379/0
      ENGINE: real
      PYTHONPATH: /app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_USE_FIXTURE: "false"
    depends_on:
      - api

volumes:
  pgdata:
