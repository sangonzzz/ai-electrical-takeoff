[project]
name = "ai-electrical-takeoff"
version = "0.1.0"
description = "AI electrical plan takeoff workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"engine/takeoff_engine/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
asyncio_mode = "auto"
